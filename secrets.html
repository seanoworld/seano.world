    <link rel="preconnect" href="https://rsms.me" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@100..700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header id="header">
      <a href="index.html">
        <img src="images/head.png" alt="Sean Mac homepage" />
      </a>
    </header>

    <nav class="nav_container">
      <div class="navlist">
        <ul>
          <li><a href="blob.html">blob</a></li>
          <li><a href="index.html">drawings</a></li>
          <li><a href="comics.html">comics</a></li>
          <li><a href="seano.html">about</a></li>
          <li><a href="shop.html">shop</a></li>
          <li>
            <a href="secrets.html" class="nav_link active">secrets</a>
          </li>
        </ul>
      </div>
    </nav>

    <main class="page-container">
      <section class="gallery" aria-label="Secrets image gallery">
        <div class="image-frame">
          <img
            id="gallery-image"
            src="images/secret1.jpg"
            alt="Gallery image 1"
          />
        </div>
        

       <div class="gallery-controls">
  <button
    type="button"
    id="previous-button"
    class="gallery-button"
    aria-label="Previous image"
  >
    <img src="buttons/arrowbackward.png" alt="" />
  </button>

  <img src="buttons/home.gif" class="gallery-center">

  <button
    type="button"
    id="next-button"
    class="gallery-button"
    aria-label="Next image"
  >
    <img src="buttons/arrowforward.png" alt="" />
  </button>
</div>
      </section>
    </main>

    <footer>
      copyrights © 2026 Sean Mac. Images on this site may not be used or
      distributed without permission. Website built by me using HTML/CSS.
    </footer>

    <script>
      const galleryImages = [
        {
          src: "images/ads/jack1.png",
          alt: "Gallery image 1",
        },
        {
          src: "images/ads/karaoke.png",
          alt: "Gallery image 2",
        },
        {
          src: "images/ads/dovetail.png",
          alt: "Gallery image 3",
        },
        {
          src: "images/ads/openmic_sarahbella.png",
          alt: "Gallery image 4",
        },
        {
            src:"images/riso/swallowtails.jpg",
            alt:"Gallery image 5"
        },
          {
            src:"images/riso/pigs.jpg",
            alt:"Gallery image 6"
        }, {
            src:"images/riso/sharky.jpg",
            alt:"Gallery image 7"
        }, {
            src:"images/riso/babybirds.png",
            alt:"Gallery image 8"
        },
      ];

      const galleryImage = document.getElementById("gallery-image");
      const previousButton = document.getElementById("previous-button");
      const nextButton = document.getElementById("next-button");
      const imageCounter = document.getElementById("image-counter");

      let currentImageIndex = 0;

      function updateGallery() {
        const currentImage = galleryImages[currentImageIndex];

        galleryImage.src = currentImage.src;
        galleryImage.alt = currentImage.alt;

        imageCounter.textContent =
          `${currentImageIndex + 1} / ${galleryImages.length}`;
      }

      function showPreviousImage() {
        currentImageIndex--;

        if (currentImageIndex < 0) {
          currentImageIndex = galleryImages.length - 1;
        }

        updateGallery();
      }

      function showNextImage() {
        currentImageIndex++;

        if (currentImageIndex >= galleryImages.length) {
          currentImageIndex = 0;
        }

        updateGallery();
      }

      previousButton.addEventListener("click", showPreviousImage);
      nextButton.addEventListener("click", showNextImage);

      document.addEventListener("keydown", function (event) {
        if (event.key === "ArrowLeft") {
          showPreviousImage();
        }

        if (event.key === "ArrowRight") {
          showNextImage();
        }
      });

      updateGallery();
    </script>
  </body>
</html>
